name: Compilar APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-20.04

    steps:
    - uses: actions/checkout@v3
    
    - name: Configurar Java 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: gradle

    - name: Descompactar e dar permissão
      run: |
        unzip -q *.zip -d . || true
        cd matvt-1.0.6y && chmod +x gradlew

    - name: Compilar com Gradle
      run: |
        cd matvt-1.0.6y
        ./gradlew assembleDebug

    - name: Disponibilizar APK
      uses: actions/upload-artifact@v3
      with:
        name: matvt-apk-pronto
        path: matvt-1.0.6y/app/build/outputs/apk/debug/app-debug.apk
        
